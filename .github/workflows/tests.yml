name: Tests and prediction files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Validate submitted prediction files
        run: python score.py --predictions validation_predictions.csv --december-predictions december_predictions.csv --output-dir work/scorer_check
